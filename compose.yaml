services:
  postgres:
    container_name: food-shop-db
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USERNAME}'
    ports:
      - '54327:5432'
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
